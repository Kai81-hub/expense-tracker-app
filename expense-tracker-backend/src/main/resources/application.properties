spring.application.name=expense-tracker

# Server
server.port=8080

# H2 in-memory database (data resets every restart - fine for development/testing)
spring.datasource.url=jdbc:h2:mem:expensedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:expensedb)
spring.h2.console.enabled=true

# ---------------------------------------------------------------
# To use MySQL instead (recommended once you move past prototyping):
# 1) Uncomment the mysql-connector-j dependency in pom.xml
# 2) Comment out the H2 block above and uncomment below
